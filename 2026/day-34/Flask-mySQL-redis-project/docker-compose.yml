services:
  mysql:
    image: mysql:8.0
    container_name: db
    environment:
      MYSQL_USER: ${DB_USER}
      MYSQL_PASSWORD: ${DB_PASSWORD}
      MYSQL_DATABASE: ${DB_NAME}
      MYSQL_RANDOM_ROOT_PASSWORD: '1'
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "${DB_USER}", "-p${DB_PASSWORD}"]
      interval: 10s
      timeout: 5s
      retries: 5
    
    ports:
      - "3306:${DB_PORT}"
    volumes:
      - dbvol:/var/lib/mysql
  
  redis:
    image: redis:7-alpine
    container_name: redis
    ports:
      - "6379:${REDIS_PORT}"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  webapp:
    build: .
    container_name: webapp
    ports:
      - "5000:${PORT}"
    env_file:
      - .env
    stop_signal: SIGINT
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy

volumes:
  dbvol:  


      

